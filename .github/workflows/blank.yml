name: Build BloxAura APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate BloxAura v2 Android Project
        run: |
          mkdir -p app/src/main/java/com/bloxaura/overlay

          cat << 'BLOXEOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BloxAuraOverlay"
          include(":app")
          BLOXEOF

          cat << 'BLOXEOF' > build.gradle.kts
          plugins { id("com.android.application") version "8.4.2" apply false }
          BLOXEOF

          cat << 'BLOXEOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          BLOXEOF

          cat << 'BLOXEOF' > app/build.gradle.kts
          plugins { id("com.android.application") }
          android {
              namespace = "com.bloxaura.overlay"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.bloxaura.overlay"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "2.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          BLOXEOF

          cat << 'BLOXEOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <queries><package android:name="com.roblox.client" /></queries>
              <application android:label="BloxAura" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".VisualOverlayService" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="Visual overlay and crosshair over games" />
                  </service>
              </application>
          </manifest>
          BLOXEOF

          cat << 'BLOXEOF' > app/src/main/java/com/bloxaura/overlay/VisualOverlayService.java
          package com.bloxaura.overlay;

          import android.app.*;
          import android.content.*;
          import android.graphics.*;
          import android.graphics.drawable.GradientDrawable;
          import android.os.*;
          import android.view.*;
          import android.widget.TextView;

          public class VisualOverlayService extends Service {
              public static final String PREFS = "bloxaura_prefs";
              public static volatile boolean isRunning = false;
              private WindowManager wm;
              private OverlayCanvas layer;
              private TextView pill;
              private WindowManager.LayoutParams pillLp;
              private boolean filterOn = true;

              @Override public void onCreate() {
                  super.onCreate();
                  isRunning = true;
                  startNotif();
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  layer = new OverlayCanvas(this);
                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                          -1, -1, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE | WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT);
                  wm.addView(layer, lp);

                  pill = new TextView(this);
                  pill.setTextSize(11f);
                  pill.setTextColor(Color.WHITE);
                  pill.setPadding(dp(12), dp(7), dp(12), dp(7));
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(0xE6121620);
                  bg.setCornerRadius(dp(20));
                  bg.setStroke(dp(1), 0x6638BDF8);
                  pill.setBackground(bg);

                  pillLp = new WindowManager.LayoutParams(-2, -2, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT);
                  pillLp.gravity = Gravity.TOP | Gravity.START;
                  pillLp.x = dp(12);
                  pillLp.y = dp(64);
                  pill.setOnTouchListener(new View.OnTouchListener() {
                      int sx, sy; float tx, ty; boolean moved;
                      @Override public boolean onTouch(View v, MotionEvent e) {
                          if (e.getAction() == MotionEvent.ACTION_DOWN) {
                              sx = pillLp.x; sy = pillLp.y; tx = e.getRawX(); ty = e.getRawY(); moved = false; return true;
                          } else if (e.getAction() == MotionEvent.ACTION_MOVE) {
                              int dx = Math.round(e.getRawX() - tx), dy = Math.round(e.getRawY() - ty);
                              if (Math.abs(dx) > 8 || Math.abs(dy) > 8) moved = true;
                              pillLp.x = sx + dx; pillLp.y = sy + dy;
                              wm.updateViewLayout(pill, pillLp); return true;
                          } else if (e.getAction() == MotionEvent.ACTION_UP && !moved) {
                              filterOn = !filterOn;
                              getSharedPreferences(PREFS, MODE_PRIVATE).edit().putBoolean("filterOn", filterOn).apply();
                              applyPrefs(); return true;
                          }
                          return false;
                      }
                  });
                  wm.addView(pill, pillLp);
                  applyPrefs();
              }

              @Override public int onStartCommand(Intent intent, int flags, int startId) { applyPrefs(); return START_STICKY; }

              private void applyPrefs() {
                  SharedPreferences p = getSharedPreferences(PREFS, MODE_PRIVATE);
                  String preset = p.getString("preset", "Future Cinema");
                  filterOn = p.getBoolean("filterOn", true);
                  int fCol = p.getInt("fCol", 0xFF1D4ED8);
                  float fOp = p.getFloat("fOp", 0.10f);
                  layer.tint = Color.argb(Math.round(Math.min(0.65f, fOp) * 255f), Color.red(fCol), Color.green(fCol), Color.blue(fCol));
                  layer.showFilter = filterOn;
                  layer.vignette = p.getFloat("vig", 0.25f);
                  layer.showCross = p.getBoolean("crossOn", true);
                  layer.crossCol = p.getInt("crossCol", 0xFF60A5FA);
                  layer.crossStyle = p.getString("crossStyle", "circle-cross");
                  layer.crossSz = p.getFloat("crossSz", 8f);
                  layer.crossTh = p.getFloat("crossTh", 2f);
                  layer.showHud = p.getBoolean("hudOn", true);
                  layer.hudCorner = p.getString("hudCorner", "top-left");
                  int fps = p.getInt("fps", 120);
                  layer.hudText = "BloxAura · " + preset + " · " + p.getString("api", "Vulkan") + " " + (fps == 0 ? "MAX" : fps) + " FPS";
                  layer.invalidate();
                  pill.setText((filterOn ? "● " : "○ ") + "BloxAura · " + preset);
              }

              private int dp(int v) { return Math.round(v * getResources().getDisplayMetrics().density); }

              @Override public void onDestroy() {
                  isRunning = false;
                  try { wm.removeView(layer); } catch (Exception ignored) {}
                  try { wm.removeView(pill); } catch (Exception ignored) {}
                  super.onDestroy();
              }

              @Override public IBinder onBind(Intent intent) { return null; }

              private void startNotif() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(new NotificationChannel("bloxaura", "BloxAura", NotificationManager.IMPORTANCE_LOW));
                      startForeground(101, new Notification.Builder(this, "bloxaura").setContentTitle("BloxAura активен").setSmallIcon(android.R.drawable.ic_menu_view).build());
                  }
              }

              static class OverlayCanvas extends View {
                  int tint = 0x1A1D4ED8, crossCol = 0xFF60A5FA;
                  float vignette = 0.25f, crossSz = 8f, crossTh = 2f;
                  boolean showFilter = true, showCross = true, showHud = true;
                  String crossStyle = "circle-cross", hudCorner = "top-left", hudText = "BloxAura";
                  final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG), tp = new Paint(Paint.ANTI_ALIAS_FLAG), bp = new Paint(Paint.ANTI_ALIAS_FLAG);
                  OverlayCanvas(Context c) { super(c); tp.setColor(Color.WHITE); bp.setColor(0xB80B0E14); }
                  @Override protected void onDraw(Canvas cv) {
                      float d = getResources().getDisplayMetrics().density, w = getWidth(), h = getHeight();
                      if (showFilter && Color.alpha(tint) > 0) cv.drawColor(tint);
                      if (showFilter && vignette > 0.01f) {
                          p.setStyle(Paint.Style.FILL);
                          p.setShader(new RadialGradient(w/2f, h/2f, Math.max(w,h)*0.72f, new int[]{0, Color.argb(Math.round(vignette*255),0,0,0)}, new float[]{0.55f,1f}, Shader.TileMode.CLAMP));
                          cv.drawRect(0, 0, w, h, p); p.setShader(null);
                      }
                      if (showHud) {
                          tp.setTextSize(11f*d); float tw = tp.measureText(hudText), bw = tw + 20f*d, bh = 26f*d, m = 14f*d;
                          float x = hudCorner.contains("right") ? w-bw-m : m, y = hudCorner.contains("bottom") ? h-bh-m : 34f*d;
                          cv.drawRoundRect(new RectF(x, y, x+bw, y+bh), 8f*d, 8f*d, bp);
                          cv.drawText(hudText, x+10f*d, y+17f*d, tp);
                      }
                      if (showCross) {
                          float cx = w/2f, cy = h/2f, sz = crossSz*d, gp = 4f*d, st = crossTh*d;
                          p.setColor(crossCol); p.setStrokeWidth(st); p.setStrokeCap(Paint.Cap.ROUND);
                          if ("dot".equals(crossStyle)) { p.setStyle(Paint.Style.FILL); cv.drawCircle(cx, cy, Math.max(2f*d, st*1.3f), p); }
                          else if ("t-shape".equals(crossStyle)) { p.setStyle(Paint.Style.STROKE); cv.drawLine(cx,cy+gp,cx,cy+gp+sz,p); cv.drawLine(cx-gp-sz,cy,cx-gp,cy,p); cv.drawLine(cx+gp,cy,cx+gp+sz,cy,p); }
                          else {
                              p.setStyle(Paint.Style.STROKE);
                              cv.drawLine(cx,cy-gp-sz,cx,cy-gp,p); cv.drawLine(cx,cy+gp,cx,cy+gp+sz,p);
                              cv.drawLine(cx-gp-sz,cy,cx-gp,cy,p); cv.drawLine(cx+gp,cy,cx+gp+sz,cy,p);
                              if ("circle-cross".equals(crossStyle)) { p.setStrokeWidth(Math.max(1f*d, st*0.75f)); cv.drawCircle(cx, cy, gp+sz*0.75f, p); }
                          }
                      }
                  }
              }
          }
          BLOXEOF

          cat << 'BLOXEOF' > app/src/main/java/com/bloxaura/overlay/MainActivity.java
          package com.bloxaura.overlay;

          import android.app.Activity;
          import android.content.*;
          import android.graphics.*;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.*;
          import android.provider.Settings;
          import android.view.*;
          import android.widget.*;

          public class MainActivity extends Activity {
              static class Preset { String n, l; int top, hor, col; float op, vig;
                  Preset(String n, int top, int hor, int col, float op, float vig, String l) { this.n=n;this.top=top;this.hor=hor;this.col=col;this.op=op;this.vig=vig;this.l=l; } }
              final Preset[] presets = {
                  new Preset("Future Cinema", 0xFF1B355C, 0xFFC98A63, 0xFF1D4ED8, 0.10f, 0.25f, "Future"),
                  new Preset("Arctic Crisp", 0xFF17375E, 0xFF98C4E8, 0xFF38BDF8, 0.09f, 0.15f, "Future"),
                  new Preset("Golden Sunset", 0xFF242347, 0xFFE88B5A, 0xFFF59E0B, 0.14f, 0.28f, "Future"),
                  new Preset("Cyber Twilight", 0xFF090D1A, 0xFF1D3254, 0xFF8B5CF6, 0.16f, 0.35f, "Future"),
                  new Preset("Competitive FPS", 0xFF2D5C94, 0xFFA6C9EB, 0xFF10B981, 0.04f, 0.05f, "Voxel"),
                  new Preset("Vanilla Classic", 0xFF3D79BD, 0xFFB8D7F5, 0xFF1D4ED8, 0.00f, 0.00f, "ShadowMap")
              };
              final String[][] places = {
                  {"142823291", "Murder Mystery 2 (Оригинал)", "Nikilis · Топ выбор"},
                  {"8942105731", "Неоновый Мегаполис RP", "Vortex Guild · Future"},
                  {"7419023318", "Тактический Полигон 5v5", "ApexBlock · Шутер"},
                  {"6308194420", "Небесная Цитадель", "CloudCraft · Приключения"},
                  {"9521048812", "Ночной Серпантин: Drift", "TougeWorks · Гонки"}
              };
              final int[] fCols = {0xFF1D4ED8, 0xFF38BDF8, 0xFF8B5CF6, 0xFFF59E0B, 0xFFEF4444, 0xFF10B981, 0xFFEC4899};
              final int[] cCols = {0xFFFFFFFF, 0xFF60A5FA, 0xFF34D399, 0xFFF43F5E, 0xFFFACC15, 0xFFA78BFA};

              SharedPreferences prefs;
              String preset="Future Cinema", crossStyle="circle-cross", hudCorner="top-left", api="Vulkan", light="Future";
              int skyTop=0xFF1B355C, skyHor=0xFFC98A63, fCol=0xFF1D4ED8, crossCol=0xFF60A5FA, fps=120;
              float fOp=0.10f, vig=0.25f, crossSz=8f, crossTh=2f;
              boolean filterOn=true, crossOn=true, hudOn=true;

              FrameLayout host; PreviewView pv; TextView status, jsonTv; Button topBtn; TextView[] tabs = new TextView[4];

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  prefs = getSharedPreferences(VisualOverlayService.PREFS, MODE_PRIVATE);
                  preset=prefs.getString("preset",preset); skyTop=prefs.getInt("skyTop",skyTop); skyHor=prefs.getInt("skyHor",skyHor);
                  filterOn=prefs.getBoolean("filterOn",filterOn); fCol=prefs.getInt("fCol",fCol); fOp=prefs.getFloat("fOp",fOp); vig=prefs.getFloat("vig",vig);
                  crossOn=prefs.getBoolean("crossOn",crossOn); crossCol=prefs.getInt("crossCol",crossCol); crossStyle=prefs.getString("crossStyle",crossStyle);
                  crossSz=prefs.getFloat("crossSz",crossSz); crossTh=prefs.getFloat("crossTh",crossTh); hudOn=prefs.getBoolean("hudOn",hudOn);
                  hudCorner=prefs.getString("hudCorner",hudCorner); fps=prefs.getInt("fps",fps); api=prefs.getString("api",api); light=prefs.getString("light",light);

                  LinearLayout root = new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); root.setBackgroundColor(0xFF0B0E14);
                  LinearLayout hdr = new LinearLayout(this); hdr.setGravity(Gravity.CENTER_VERTICAL); hdr.setBackgroundColor(0xFF0F131C); hdr.setPadding(dp(16),dp(36),dp(16),dp(12));
                  LinearLayout bc = new LinearLayout(this); bc.setOrientation(LinearLayout.VERTICAL);
                  TextView br = new TextView(this); br.setText("BloxAura"); br.setTextColor(Color.WHITE); br.setTextSize(19f); br.setTypeface(Typeface.DEFAULT_BOLD);
                  status = new TextView(this); status.setTextSize(11f); bc.addView(br); bc.addView(status);
                  hdr.addView(bc, new LinearLayout.LayoutParams(0,-2,1f));
                  topBtn = new Button(this); topBtn.setAllCaps(false); topBtn.setTextSize(12f); topBtn.setTextColor(Color.WHITE); topBtn.setPadding(dp(14),dp(8),dp(14),dp(8));
                  topBtn.setOnClickListener(v -> {
                      if (VisualOverlayService.isRunning) { stopService(new Intent(this, VisualOverlayService.class)); updateHeader(); }
                      else launchRoblox(null);
                  });
                  hdr.addView(topBtn); root.addView(hdr);

                  host = new FrameLayout(this); root.addView(host, new LinearLayout.LayoutParams(-1,0,1f));
                  LinearLayout nav = new LinearLayout(this); nav.setBackgroundColor(0xFF0F131C); nav.setPadding(dp(8),dp(8),dp(8),dp(12));
                  String[] names = {"Студия", "Плейсы", "Прицел", "Флаги"};
                  for (int i=0;i<4;i++) { final int idx=i; TextView t=new TextView(this); t.setText(names[i]); t.setGravity(Gravity.CENTER); t.setTextSize(12f); t.setTypeface(Typeface.DEFAULT_BOLD);
                      t.setPadding(dp(4),dp(12),dp(4),dp(12)); t.setOnClickListener(v -> openTab(idx));
                      LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(0,-2,1f); lp.setMargins(dp(4),0,dp(4),0); nav.addView(t,lp); tabs[i]=t; }
                  root.addView(nav); setContentView(root); updateHeader(); openTab(0);
