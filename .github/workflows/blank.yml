              @Override protected void onResume() { super.onResume(); updateHeader(); }

              void updateHeader() {
                  if (!Settings.canDrawOverlays(this)) { status.setText("Нужно разрешение «Поверх окон»"); status.setTextColor(0xFFFBBF24); topBtn.setText("Разрешить и старт"); topBtn.setBackground(bg(0xFF2563EB,12,0)); }
                  else if (VisualOverlayService.isRunning) { status.setText("Активен · " + preset); status.setTextColor(0xFF34D399); topBtn.setText("Выключить"); topBtn.setBackground(bg(0xFFEF4444,12,0)); }
                  else { status.setText("Готов · " + preset); status.setTextColor(0xFF94A3B8); topBtn.setText("Запуск в Roblox"); topBtn.setBackground(bg(0xFF2563EB,12,0)); }
              }

              void sync() {
                  prefs.edit().putString("preset",preset).putInt("skyTop",skyTop).putInt("skyHor",skyHor).putBoolean("filterOn",filterOn)
                      .putInt("fCol",fCol).putFloat("fOp",fOp).putFloat("vig",vig).putBoolean("crossOn",crossOn).putInt("crossCol",crossCol)
                      .putString("crossStyle",crossStyle).putFloat("crossSz",crossSz).putFloat("crossTh",crossTh).putBoolean("hudOn",hudOn)
                      .putString("hudCorner",hudCorner).putInt("fps",fps).putString("api",api).putString("light",light).apply();
                  if (pv != null) pv.invalidate();
                  if (jsonTv != null) jsonTv.setText(makeJson());
                  if (VisualOverlayService.isRunning) {
