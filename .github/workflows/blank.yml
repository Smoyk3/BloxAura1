                          boolean s = p.n.equals(preset); ch.setBackground(bg(s?0xFF1E3A8A:0xFF0F131C,12,s?0xFF60A5FA:0x1FFFFFFF));
                          TextView t1 = new TextView(this); t1.setText(p.n); t1.setTextColor(Color.WHITE); t1.setTextSize(13f); t1.setTypeface(Typeface.DEFAULT_BOLD);
                          TextView t2 = new TextView(this); t2.setText(p.l+" · "+Math.round(p.op*100)+"%"); t2.setTextColor(0xFF94A3B8); t2.setTextSize(11f);
                          ch.addView(t1); ch.addView(t2);
