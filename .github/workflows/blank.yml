                  } else if (tab == 2) {
                      pv = new PreviewView(this); LinearLayout.LayoutParams plp = new LinearLayout.LayoutParams(-1, dp(165)); plp.setMargins(0,0,0,dp(12)); box.addView(pv, plp);
                      LinearLayout cc = card();
                      cc.addView(swRow("Кастомный прицел", crossOn, (b,c) -> { crossOn=c; sync(); }));
                      cc.addView(chips("Форма", new String[]{"circle-cross","cross","dot","t-shape"}, new String[]{"Круг+Крест","Крест","Точка","T-прицел"}, crossStyle, v -> { crossStyle=v; sync(); openTab(2); }));
                      cc.addView(palRow("Цвет прицела", cCols, crossCol, c -> { crossCol=c; sync(); openTab(2); }));
                      cc.addView(seekRow("Размер", Math.round(crossSz), 20, " dp", v -> { crossSz=Math.max(2f,v); sync(); }));
                      cc.addView(seekRow("Толщина", Math.round(crossTh), 6, " dp", v -> { crossTh=Math.max(1f,v); sync(); }));
                      box.addView(cc);
