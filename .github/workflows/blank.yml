                      hc.addView(swRow("HUD-плашка поверх игры", hudOn, (b,c) -> { hudOn=c; sync(); }));
                      hc.addView(chips("Угол HUD", new String[]{"top-left","top-right","bottom-left","bottom-right"}, new String[]{"Верх лево","Верх право","Низ лево","Низ право"}, hudCorner, v -> { hudCorner=v; sync(); openTab(2); }));
                      box.addView(hc);
                  } else {
                      LinearLayout fc = card(); fc.addView(title("FastFlags (ClientAppSettings.json)"));
                      fc.addView(chips("Лимит FPS", new String[]{"60","90","120","240","0"}, new String[]{"60","90","120","240","Без лимита"}, String.valueOf(fps), v -> { fps=Integer.parseInt(v); sync(); openTab(3); }));
                      fc.addView(chips("API", new String[]{"Vulkan","OpenGL"}, new String[]{"Vulkan","OpenGL"}, api, v -> { api=v; sync(); openTab(3); }));
                      fc.addView(chips("Освещение", new String[]{"Future","ShadowMap","Voxel"}, new String[]{"Future","ShadowMap","Voxel"}, light, v -> { light=v; sync(); openTab(3); }));
                      jsonTv = new TextView(this); jsonTv.setText(makeJson()); jsonTv.setTextColor(0xFF93C5FD); jsonTv.setTextSize(11f); jsonTv.setTypeface(Typeface.MONOSPACE);
                      jsonTv.setPadding(dp(12),dp(12),dp(12),dp(12)); jsonTv.setBackground(bg(0xFF080A0F,10,0x1FFFFFFF));
                      LinearLayout.LayoutParams jlp = new LinearLayout.LayoutParams(-1,-2); jlp.setMargins(0,dp(10),0,dp(10)); fc.addView(jsonTv, jlp);
                      Button cb = btn("Скопировать JSON", 0xFF2563EB);
                      cb.setOnClickListener(v -> {
                          ClipboardManager cm = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                          if (cm != null) { cm.setPrimaryClip(ClipData.newPlainText("ClientAppSettings.json", makeJson())); Toast.makeText(this, "Скопировано", Toast.LENGTH_SHORT).show(); }
                      });
                      fc.addView(cb); box.addView(fc);
                  }
                  sv.addView(box); host.addView(sv);
              }

              String makeJson() {
                  int fv = fps == 0 ? 9999 : fps;
                  return "{\n  \"DFIntTaskSchedulerTargetFps\": " + fv + ",\n  \"DFIntMobileHardwareMaxFps\": " + (fps==0?120:fps)
                      + ",\n  \"FFlagDebugGraphicsPrefer" + api + "\": true,\n  \"FFlagDebugForceFutureIsBrightPhase" + ("Future".equals(light)?3:("ShadowMap".equals(light)?2:1)) + "\": true\n}";
              }

              void launchRoblox(String placeId) {
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
                      Toast.makeText(this, "Разрешите «Поверх других окон» и нажмите ещё раз", Toast.LENGTH_LONG).show(); return;
                  }
                  sync();
                  Intent svc = new Intent(this, VisualOverlayService.class);
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(svc); else startService(svc);
                  updateHeader();
                  String u = (placeId != null && !placeId.isEmpty()) ? "roblox://placeId=" + placeId : "roblox://navigation/home";
                  try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(u))); }
                  catch (Exception e) { Toast.makeText(this, "Оверлей запущен! Откройте Roblox.", Toast.LENGTH_SHORT).show(); }
              }

              LinearLayout card() { LinearLayout c=new LinearLayout(this); c.setOrientation(LinearLayout.VERTICAL); c.setPadding(dp(14),dp(14),dp(14),dp(14)); c.setBackground(bg(0xFF121620,14,0x1AFFFFFF)); LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,-2); lp.setMargins(0,0,0,dp(12)); c.setLayoutParams(lp); return c; }
              TextView title(String t) { TextView tv=new TextView(this); tv.setText(t); tv.setTextColor(Color.WHITE); tv.setTextSize(14f); tv.setTypeface(Typeface.DEFAULT_BOLD); return tv; }
              Button btn(String t, int c) { Button b=new Button(this); b.setText(t); b.setAllCaps(false); b.setTextColor(Color.WHITE); b.setTextSize(13f); b.setPadding(dp(14),dp(11),dp(14),dp(11)); b.setBackground(bg(c,12,0)); return b; }
              View swRow(String t, boolean chk, CompoundButton.OnCheckedChangeListener l) { LinearLayout r=new LinearLayout(this); r.setGravity(Gravity.CENTER_VERTICAL); r.setPadding(0,dp(4),0,dp(8)); TextView tv=title(t); r.addView(tv,new LinearLayout.LayoutParams(0,-2,1f)); Switch s=new Switch(this); s.setChecked(chk); s.setOnCheckedChangeListener(l); r.addView(s); return r; }
              interface IntCb { void onVal(int v); }
              interface StrCb { void onVal(String v); }
              View seekRow(String lbl, int init, int max, String suf, IntCb cb) {
                  LinearLayout b=new LinearLayout(this); b.setOrientation(LinearLayout.VERTICAL); b.setPadding(0,dp(6),0,dp(4));
                  LinearLayout top=new LinearLayout(this); TextView l=new TextView(this); l.setText(lbl); l.setTextColor(0xFFCBD5E1); l.setTextSize(12f); top.addView(l,new LinearLayout.LayoutParams(0,-2,1f));
                  TextView v=new TextView(this); v.setText(init+suf); v.setTextColor(0xFF60A5FA); v.setTextSize(12f); top.addView(v); b.addView(top);
                  SeekBar sb=new SeekBar(this); sb.setMax(max); sb.setProgress(Math.min(max,Math.max(0,init)));
                  sb.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar s, int p, boolean u) { v.setText(p+suf); if (u) cb.onVal(p); }
                      @Override public void onStartTrackingTouch(SeekBar s) {}
                      @Override public void onStopTrackingTouch(SeekBar s) {}
                  }); b.addView(sb); return b;
              }
              View palRow(String lbl, int[] cols, int sel, IntCb cb) {
                  LinearLayout b=new LinearLayout(this); b.setOrientation(LinearLayout.VERTICAL); b.setPadding(0,dp(6),0,dp(6));
                  TextView tv=new TextView(this); tv.setText(lbl); tv.setTextColor(0xFFCBD5E1); tv.setTextSize(12f); tv.setPadding(0,0,0,dp(8)); b.addView(tv);
                  LinearLayout r=new LinearLayout(this);
                  for (int c : cols) { View d=new View(this); GradientDrawable gd=new GradientDrawable(); gd.setShape(GradientDrawable.OVAL); gd.setColor(c); gd.setStroke(dp(c==sel?3:1), c==sel?Color.WHITE:0x44FFFFFF); d.setBackground(gd); d.setOnClickListener(v -> cb.onVal(c)); LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(dp(30),dp(30)); lp.setMargins(0,0,dp(10),0); r.addView(d,lp); }
                  b.addView(r); return b;
              }
              View chips(String lbl, String[] vals, String[] ts, String cur, StrCb cb) {
                  LinearLayout b=new LinearLayout(this); b.setOrientation(LinearLayout.VERTICAL); b.setPadding(0,dp(8),0,dp(4));
                  TextView tv=new TextView(this); tv.setText(lbl); tv.setTextColor(0xFFCBD5E1); tv.setTextSize(12f); tv.setPadding(0,0,0,dp(6)); b.addView(tv);
                  HorizontalScrollView hsv=new HorizontalScrollView(this); LinearLayout r=new LinearLayout(this);
                  for (int i=0;i<vals.length;i++) { final String val=vals[i]; boolean s=val.equals(cur); TextView ch=new TextView(this); ch.setText(ts[i]); ch.setTextColor(s?Color.WHITE:0xFF94A3B8); ch.setTextSize(12f);
                      ch.setPadding(dp(12),dp(8),dp(12),dp(8)); ch.setBackground(bg(s?0xFF2563EB:0xFF0F131C,10,s?0:0x1FFFFFFF)); ch.setOnClickListener(v -> cb.onVal(val));
                      LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-2,-2); lp.setMargins(0,0,dp(8),0); r.addView(ch,lp); }
                  hsv.addView(r); b.addView(hsv); return b;
              }
              GradientDrawable bg(int fill, int rDp, int stroke) { GradientDrawable gd=new GradientDrawable(); gd.setColor(fill); gd.setCornerRadius(dp(rDp)); if (stroke!=0) gd.setStroke(dp(1),stroke); return gd; }
              int dp(int v) { return Math.round(v * getResources().getDisplayMetrics().density); }

              class PreviewView extends View {
                  final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG), tp = new Paint(Paint.ANTI_ALIAS_FLAG);
                  PreviewView(Context c) { super(c); tp.setColor(Color.WHITE); }
                  @Override protected void onDraw(Canvas cv) {
                      float w=getWidth(), h=getHeight(), d=getResources().getDisplayMetrics().density, r=14f*d; RectF cr=new RectF(0,0,w,h);
                      p.setStyle(Paint.Style.FILL); p.setShader(new LinearGradient(0,0,0,h*0.68f,skyTop,skyHor,Shader.TileMode.CLAMP)); cv.drawRoundRect(cr,r,r,p); p.setShader(null);
                      p.setColor(0x55FFD9A8); cv.drawCircle(w*0.78f,h*0.25f,22f*d,p); p.setColor(0xFFFFE4B5); cv.drawCircle(w*0.78f,h*0.25f,11f*d,p);
                      p.setColor(0xFF1F2937); cv.drawRect(0,h*0.65f,w,h,p); p.setColor(0x3360A5FA); p.setStrokeWidth(1f*d);
                      for (int gx=0;gx<10;gx++) { float x=(w/9f)*gx; cv.drawLine(x,h*0.65f,w*0.5f+(x-w*0.5f)*1.45f,h,p); }
                      float ax=w*0.5f, base=h*0.78f; p.setStyle(Paint.Style.FILL);
                      p.setColor(0xFF334155); cv.drawRoundRect(new RectF(ax-12*d,base-24*d,ax-1*d,base),3*d,3*d,p); cv.drawRoundRect(new RectF(ax+1*d,base-24*d,ax+12*d,base),3*d,3*d,p);
                      p.setColor(0xFF1E40AF); cv.drawRoundRect(new RectF(ax-14*d,base-52*d,ax+14*d,base-24*d),4*d,4*d,p);
                      p.setColor(0xFF475569); cv.drawRoundRect(new RectF(ax-22*d,base-50*d,ax-15*d,base-25*d),3*d,3*d,p); cv.drawRoundRect(new RectF(ax+15*d,base-50*d,ax+22*d,base-25*d),3*d,3*d,p);
                      p.setColor(0xFFE2E8F0); cv.drawRoundRect(new RectF(ax-10*d,base-72*d,ax+10*d,base-53*d),5*d,5*d,p);
                      p.setColor(0xFF38BDF8); cv.drawRoundRect(new RectF(ax-7*d,base-66*d,ax+7*d,base-61*d),2*d,2*d,p);
                      if (filterOn && fOp>0.005f) { p.setColor(Color.argb(Math.round(Math.min(0.65f,fOp)*255f),Color.red(fCol),Color.green(fCol),Color.blue(fCol))); cv.drawRoundRect(cr,r,r,p); }
                      if (filterOn && vig>0.01f) { p.setShader(new RadialGradient(w/2f,h/2f,Math.max(w,h)*0.7f,new int[]{0,Color.argb(Math.round(vig*220),0,0,0)},new float[]{0.5f,1f},Shader.TileMode.CLAMP)); cv.drawRoundRect(cr,r,r,p); p.setShader(null); }
                      if (crossOn) {
                          float cx=w/2f, cy=h/2f, sz=crossSz*d, gp=4f*d; p.setColor(crossCol); p.setStrokeWidth(crossTh*d); p.setStrokeCap(Paint.Cap.ROUND);
                          if ("dot".equals(crossStyle)) { p.setStyle(Paint.Style.FILL); cv.drawCircle(cx,cy,Math.max(2f*d,crossTh*d),p); }
                          else if ("t-shape".equals(crossStyle)) { p.setStyle(Paint.Style.STROKE); cv.drawLine(cx,cy+gp,cx,cy+gp+sz,p); cv.drawLine(cx-gp-sz,cy,cx-gp,cy,p); cv.drawLine(cx+gp,cy,cx+gp+sz,cy,p); }
                          else { p.setStyle(Paint.Style.STROKE); cv.drawLine(cx,cy-gp-sz,cx,cy-gp,p); cv.drawLine(cx,cy+gp,cx,cy+gp+sz,p); cv.drawLine(cx-gp-sz,cy,cx-gp,cy,p); cv.drawLine(cx+gp,cy,cx+gp+sz,cy,p);
                              if ("circle-cross".equals(crossStyle)) { p.setStrokeWidth(Math.max(1f*d,crossTh*0.75f*d)); cv.drawCircle(cx,cy,gp+sz*0.75f,p); } }
                      }
                      if (hudOn) {
                          p.setStyle(Paint.Style.FILL); p.setColor(0xB80B0E14); tp.setTextSize(10.5f*d);
                          String lbl = "BloxAura · " + preset + " · " + (fps==0?"MAX":fps) + " FPS";
                          float tw = tp.measureText(lbl), bx = hudCorner.contains("right")?w-tw-26f*d:10f*d, by = hudCorner.contains("bottom")?h-32f*d:10f*d;
                          cv.drawRoundRect(new RectF(bx,by,bx+tw+16f*d,by+22f*d),7f*d,7f*d,p); cv.drawText(lbl,bx+8f*d,by+15f*d,tp);
                      }
                  }
              }
          }
          BLOXEOF

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BloxAuraOverlay-debug
          path: app/build/outputs/apk/debug/app-debug.apk
