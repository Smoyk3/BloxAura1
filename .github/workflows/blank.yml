                          LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-2,-2); lp.setMargins(0,dp(8),dp(8),dp(4)); row.addView(ch, lp);
                      }
                      hsv.addView(row); pc.addView(hsv); box.addView(pc);
                      LinearLayout fc = card();
                      fc.addView(swRow("Цветовой фильтр", filterOn, (b,c) -> { filterOn=c; sync(); }));
