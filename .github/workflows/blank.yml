                  if (tab == 0) {
                      pv = new PreviewView(this); LinearLayout.LayoutParams plp = new LinearLayout.LayoutParams(-1, dp(185)); plp.setMargins(0,0,0,dp(12)); box.addView(pv, plp);
                      LinearLayout pc = card(); pc.addView(title("Пресеты графики"));
